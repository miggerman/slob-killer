<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slob Killer">
<meta name="theme-color" content="#e10600">
<meta name="description" content="Track food, workouts, water and sleep. Everything stays on your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Slob Killer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Red alert: one fixed scheme in red, white and black. Red header band, white page, black-edged cards, black controls, black tab bar. */
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f3f3; --ink:#000000; --ink-2:#2b2b2b; --ink-3:#666666; --line:#dddddd; --edge:#000000;
  --red:#e10600; --red-hi:#ff2a1f; --red-soft:#ffe4e2; --red-tint:#ffd6d4;
  --accent:#000000; --accent-ink:#ffffff; --accent-soft:#ffe4e2;
  --good:#000000; --good-soft:#000000; --warn:#e10600; --warn-soft:#ffe4e2; --bad:#e10600; --bad-soft:#ffe4e2;
  --s1:#000000; --s2:#e10600;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.big,.tbl{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.top-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.top h1{font:750 28px/1.05 var(--font-display);font-stretch:88%;letter-spacing:-.01em;margin-top:4px}
.brand{font:800 55px/0.95 var(--font-display);font-size:min(55px,14vw);font-stretch:75%;text-transform:uppercase;text-align:center;letter-spacing:.01em;white-space:nowrap;padding:2px 0 4px}
.top-row2{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center}
.center{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.center .lbl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:4px;border-radius:10px;cursor:pointer;line-height:1.2}
.center .lbl b{font-weight:600;font-size:15px;white-space:nowrap}
.center .lbl small{font-size:12px;color:var(--ink-3)}
.pagename{font-weight:600;font-size:16px}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn svg{width:20px;height:20px}

main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:12px}
.view[hidden]{display:none}
.region:empty{display:none}
.region{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h h2{font:600 12px/1.2 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.big{font:750 44px/1 var(--font-display);font-stretch:82%;letter-spacing:-.015em}
.mid{font:700 26px/1.05 var(--font-display);font-stretch:85%}
.unit{font:500 14px var(--font-body);color:var(--ink-3);margin-left:4px;letter-spacing:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:12px;color:var(--ink-3);font-weight:500}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.over>span{background:var(--warn)}
.meter.goodm>span{background:var(--good)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro .k{font-size:12px;color:var(--ink-3)}
.macro .v{font-weight:600}
.hint{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}

.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font-body);padding:6px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);max-width:100%;line-height:1.2}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.btn{appearance:none;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font:600 15px/1.1 var(--font-body);padding:11px 16px;min-height:44px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.end{justify-content:flex-end}
.btns .grow{flex:1}
.linkbtn{appearance:none;background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;cursor:pointer}

input,textarea,select{font:16px/1.35 var(--font-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type="time"]{min-height:44px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl-s{font-size:12px;font-weight:600;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.list{display:flex;flex-direction:column}
.row{appearance:none;background:none;border:0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;text-align:left;width:100%;cursor:pointer;min-height:48px}
.list .row:first-child{border-top:0}
.row .t{font-size:12px;color:var(--ink-3);width:58px}
.row .n{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--ink-3)}
.row .kc{font-weight:600;text-align:right}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}

.quick{display:flex;flex-wrap:wrap;gap:8px}
.qchip{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 12px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;text-align:left}
.qchip small{color:var(--ink-3);font-size:12px}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .qrow:first-child{border-top:0}
.qpick{appearance:none;background:none;border:0;text-align:left;padding:0;cursor:pointer;color:inherit;font:inherit;min-width:0}
.qpick .n{font-weight:500;overflow-wrap:anywhere}
.qpick .s,.qrow .s{font-size:12px;color:var(--ink-3)}
.qpick u{color:var(--red);text-decoration:none;font-weight:600}

.std{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.std .it{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.std .it.done{background:var(--good-soft);border-color:transparent}
.std .it .k{font-size:12px;color:var(--ink-3)}
.std .it.done .k,.std .it.done .v{color:var(--good)}
.std .it .v{font-weight:600}
.std .it .s{font-size:11px;line-height:1.3;color:var(--ink-3)}
.std .it.done .s{color:#d6d6d6}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.strip .d{border-radius:10px;padding:8px 0;border:1px solid var(--line);background:var(--surface-2);font-size:12px;display:flex;flex-direction:column;gap:2px}
.strip .d b{font-size:13px}
.strip .d.full{background:var(--good-soft);color:var(--good);border-color:transparent}
.strip .d.part{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.strip .d.sel{outline:2px solid var(--accent);outline-offset:-2px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tmpl{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:64px}
.tmpl b{font-weight:600}
.tmpl span{font-size:12px;color:var(--ink-3)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.viz{width:100%;display:block;touch-action:manipulation}
.viz text{fill:var(--ink-3);font:11px var(--font-body)}
.viz .gl{stroke:var(--line);stroke-width:1}
.viz .base{stroke:var(--ink-3);stroke-width:1}
.viz .b1{fill:var(--s1)}
.viz .b2{fill:var(--s2)}
.viz .tg{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 4}
.viz .hit{fill:transparent;cursor:pointer}
.viz .selband{fill:var(--accent-soft)}
.readout{font-size:14px;color:var(--ink-2);min-height:20px}
.readout b{color:var(--ink)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:right;padding:6px 4px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{border-top:1px solid var(--line);padding:8px 4px;text-align:right;white-space:nowrap}
.tbl tr.tot td{font-weight:600;border-top:2px solid var(--line)}

.idea h3{font:700 22px/1.15 var(--font-display);font-stretch:88%}
.dish{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.dish h4{margin:0;font-size:16px}
.dish ul,.gro ul{margin:0;padding-left:18px}
details.past{border-top:1px solid var(--line);padding:10px 0}
details.past summary{cursor:pointer;font-weight:500}

.shop-sec h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 2px}
.sitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.box{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-3);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.box[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.box svg{width:16px;height:16px}
.sitem.got .nm{text-decoration:line-through;color:var(--ink-3)}
.toggle{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.xbtn{appearance:none;border:0;background:none;color:var(--ink-3);font-size:20px;line-height:1;cursor:pointer;padding:6px 8px}

.banner{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-soft)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink-3);text-decoration:none;font-size:11px;font-weight:600;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

#sheet{position:fixed;inset:0;z-index:20;background:rgba(8,10,14,.48);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{font:700 22px/1.1 var(--font-display);font-stretch:88%}
.form{display:flex;flex-direction:column;gap:12px}
.est{font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast[hidden]{display:none}
#wo-fields{display:flex;flex-direction:column;gap:12px}
.exhead,.exrow{display:grid;grid-template-columns:minmax(0,1fr) 76px 62px 30px;gap:8px;align-items:center}
.exhead{font-size:12px;font-weight:600;color:var(--ink-2)}
.exrows{display:flex;flex-direction:column;gap:8px}
.exrow input{padding:10px 8px}
.bytime summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--red)}
.wbtns{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:8px}
.partial{font-size:14px;color:var(--ink-3);font-style:italic;min-height:0}
.partial:empty{display:none}
.mic[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.mic[aria-pressed="true"]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.heard{font-size:14px;color:var(--ink-3)}
.done{display:flex;flex-direction:column;gap:6px}
.done div{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:14px}
.done svg{width:18px;height:18px;color:var(--good);margin-top:1px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.mic[aria-pressed="true"]::before{animation:none}}
@media (max-width:360px){.big{font-size:38px}.macros{gap:6px}}
/* Red alert overrides */
:focus-visible{outline-color:var(--red)}
.top{background:var(--red);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0;color:#fff}
.brand{color:#fff}
.top .icon-btn{background:#fff;border-color:#fff;color:var(--red)}
.center .lbl{color:#fff}
.center .lbl small{color:var(--red-tint)}
.pagename{color:#fff}
.card{border:1.5px solid var(--edge)}
.btn.ghost{background:#fff;border:1.5px solid var(--edge);color:var(--ink)}
.linkbtn{color:var(--red)}
.red{color:var(--red)}
.chip.good{background:#000;color:#fff}
.chip.warn,.chip.bad{background:var(--red);color:#fff}
.chip.acc{background:var(--red);color:#fff}
.std .it{border-color:var(--edge);background:#fff}
.std .it.done{background:#000;border-color:#000}
.std .it.done .k,.std .it.done .v{color:#fff}
.strip .d{border-color:var(--edge);background:#fff}
.strip .d.full{background:#000;color:#fff;border-color:#000}
.strip .d.part{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.strip .d.sel{outline-color:var(--red)}
.box{border-color:#000}
.box[aria-pressed="true"]{background:#000;border-color:#000;color:#fff}
.toggle[aria-pressed="true"]{background:var(--red);color:#fff}
.done svg{color:var(--red)}
.meter{border-color:#cfcfcf}
.meter.over>span{background:var(--red)}
.meter.goodm>span{background:#000}
.banner{background:var(--red-soft);color:var(--ink)}
.banner.warn{background:var(--red-soft);border:1.5px solid var(--red)}
.tabs{background:#000;border-top:0}
.tab{color:#9a9a9a}
.tab[aria-current="page"]{color:var(--red-hi)}
.mic[aria-pressed="true"]{background:var(--red);color:#fff}
.mic[aria-pressed="true"]::before{background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--red);outline-offset:0;border-color:transparent}
#sheet{background:rgba(0,0,0,.55)}
.toast{background:#000;color:#fff}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="top-in" id="top"></div></header>
  <main id="main">
    <section class="view" id="view-today" aria-label="Today">
      <div class="region" id="t-banner"></div>
      <div class="region" id="t-summary"></div>
      <div class="card" id="composer">
        <div class="card-h"><h2><label for="food-text">What did you eat?</label></h2><button class="linkbtn" data-act="manual-food">Enter numbers myself</button></div>
        <textarea id="food-text" rows="2" enterkeyhint="go" placeholder="&#8220;2 eggs, a banana and 150 g chicken breast&#8221; &#183; &#8220;500 ml water&#8221;"></textarea>
        <div class="partial" id="c-partial" aria-live="polite"></div>
        <div class="btns">
          <button class="btn ghost mic" data-act="mic" id="mic-btn" hidden aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="mic-lbl">Speak</span>
          </button>
          <button class="btn ghost" data-act="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Search
          </button>
          <button class="btn grow" data-act="run-cmd" id="est-btn">Log it</button>
        </div>
        <div class="small muted" id="kbd-hint">Tip: tap the box, then the mic key on your keyboard, and say what you ate. Split foods with &#8220;and&#8221; or commas.</div>
        <div class="region" id="c-result"></div>
        <div class="region" id="c-quick"></div>
      </div>
      <div class="region" id="t-foods"></div>
      <div class="region" id="t-water"></div>
      <div class="region" id="t-training"></div>
      <div class="region" id="t-body"></div>
    </section>
    <section class="view" id="view-week" aria-label="Week" hidden><div class="region" id="w-all"></div></section>
    <section class="view" id="view-train" aria-label="Training" hidden><div class="region" id="tr-all"></div></section>
    <section class="view" id="view-shop" aria-label="Groceries" hidden>
      <form class="card" id="shop-form">
        <div class="card-h"><h2><label for="shop-name">Add to list</label></h2></div>
        <div class="grid2" style="grid-template-columns:1fr auto">

/* ---------- matching what someone typed or said ---------- */
const STOP = new Set(['of', 'the', 'a', 'an', 'some', 'my', 'i', 'had', 'ate', 'have', 'just', 'plain', 'cooked', 'fresh', 'organic', 'raw', 'piece', 'pieces', 'big', 'little', 'bit']);
const stem = w => w.length > 3 ? w.replace(/ies$/, 'y').replace(/(oes|ches|shes|sses|xes)$/, m => m.slice(0, -2)).replace(/([^s])s$/, '$1') : w;
const toks = s => String(s || '').toLowerCase().replace(/[^a-z0-9% ]+/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w)).map(stem);
function matchScore(q, cand) {
  const Q = toks(q);
  if (!Q.length) return 0;
  let best = 0;
  for (const label of [cand.name, ...(cand.alias || [])]) {
    const T = toks(label);
    if (!T.length) continue;
    const hit = Q.filter(w => T.includes(w)).length;
    if (!hit) continue;
    const sc = hit / Q.length * 0.7 + hit / T.length * 0.3;
    if (sc > best) best = sc;
  }
  return best;
}
// The person's own foods (one-tap list and anything logged in the last 60 days), stored per serving.
function ownFoods() {
  const seen = new Map();
  for (const f of ((state.myfoods && state.myfoods.items) || [])) seen.set(f.name.trim().toLowerCase(), Object.assign({}, normFood(f), {src: 'mine'}));
  for (const c of recentFoods(60)) { const k = c.item.name.trim().toLowerCase(); if (!seen.has(k)) seen.set(k, Object.assign({}, normFood(c.item), {src: 'recent'})); }
  return [...seen.values()];
}
function localSearch(q, limit) {
  const own = ownFoods().map(f => ({f, s: matchScore(q, f) + (f.name.trim().toLowerCase() === q.trim().toLowerCase() ? 0.3 : 0.05)}));
  const db = FOODS.map(f => ({f, s: matchScore(q, f)}));
  return [...own, ...db].filter(x => x.s >= 0.35).sort((a, b) => b.s - a.s).slice(0, limit || 12).map(x => x.f);
}

const NUMW = {a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, half: 0.5, couple: 2, few: 3, dozen: 12};
const UNIT_RE = /^(kg|kilos?|kilograms?|g|gr|grams?|oz|ounces?|lbs?|pounds?|ml|millilit(?:er|re)s?|l|lit(?:er|re)s?|cups?|tbsps?|tablespoons?|tsps?|teaspoons?|slices?|pieces?|pcs?|scoops?|handfuls?|servings?|cans?|bars?|bowls?|glass(?:es)?|bottles?|sticks?|small|medium|large|fillets?|squares?)\b\.?\s*/;
function normUnit(u) {
  u = u.toLowerCase();
  if (/^(kg|kilo)/.test(u)) return 'kg';
  if (/^(g|gr|gram)/.test(u)) return 'g';
  if (/^(oz|ounce)/.test(u)) return 'oz';
  if (/^(lb|pound)/.test(u)) return 'lb';
  if (/^(ml|millilit)/.test(u)) return 'ml';
  if (/^(l$|lit)/.test(u)) return 'l';
  if (/^cup/.test(u)) return 'cup';
  if (/^(tbsp|tablespoon)/.test(u)) return 'tbsp';
  if (/^(tsp|teaspoon)/.test(u)) return 'tsp';
  if (/^glass/.test(u)) return 'glass';
  if (/^bottle/.test(u)) return 'bottle';
  return 'unit';
}
function parseLine(raw) {
  let s = raw.trim().toLowerCase().replace(/^(and|also|then|plus)\s+/, '').replace(/^(i\s+)?(had|ate|drank|eaten|have)\s+/, '');
  let qty = null, unit = '';
  let m = s.match(/^(\d+(?:[.,]\d+)?|\d+\/\d+)\s*/);
  if (m) { qty = m[1].includes('/') ? m[1].split('/')[0] / m[1].split('/')[1] : parseFloat(m[1].replace(',', '.')); s = s.slice(m[0].length); }
  else if ((m = s.match(/^(an?\s+half|half\s+an?|half|a\s+couple\s+of|a\s+couple|couple\s+of|a\s+few|a\s+dozen|an?|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\s+/))) {
    const w = m[1].replace(/\s+(of|an?)$/, '').replace(/^an?\s+/, '').replace(/\s+.*/, '');
    qty = /half/.test(m[1]) ? 0.5 : (NUMW[w] || 1);
    s = s.slice(m[0].length);
  }
  if ((m = s.match(UNIT_RE))) { unit = normUnit(m[1]); s = s.slice(m[0].length); }
  s = s.replace(/^of\s+/, '');
  if (qty == null && (m = s.match(/\s+(\d+(?:\.\d+)?)\s*(kg|g|grams?|oz|ml|l|cups?)\s*$/))) { qty = +m[1]; unit = normUnit(m[2]); s = s.slice(0, m.index); }
  return {raw: raw.trim(), qty: qty == null ? 1 : qty, explicit: qty != null, unit, name: s.trim()};
}
function gramsFor(food, qty, unit) {
  const u = food.unit;
  switch (unit) {
    case 'g': case 'ml': return qty;
    case 'kg': case 'l': return qty * 1000;
    case 'oz': return qty * 28.35;
    case 'lb': return qty * 453.6;
    case 'cup': return qty * (u === 'cup' ? food.unitG : 240);
    case 'tbsp': return qty * (u === 'tbsp' ? food.unitG : 15);
    case 'tsp': return qty * (u === 'tsp' ? food.unitG : 5);
    case 'glass': return qty * (u === 'glass' ? food.unitG : 250);
    case 'bottle': return qty * 500;
    default: return qty * food.unitG;
  }
}
// Turn a food plus an amount into a log entry.
function portion(food, qty, unit) {
  if (food.src === 'mine' || food.src === 'recent') {
    const k = qty || 1;
    return {name: food.name, qty: k === 1 ? food.qty : `${fmt1(k)} × ${food.qty || 'serving'}`, kcal: Math.round(food.kcal * k), protein: num(food.protein * k), carbs: num(food.carbs * k), fat: num(food.fat * k), fiber: num(food.fiber * k)};
  }
  const g = Math.max(0, gramsFor(food, qty, unit));
  const r = g / 100;
  const isUnit = !unit || unit === 'unit';
  const label = isUnit && food.unit !== 'serving' ? `${fmt1(qty)} ${food.unit}${qty === 1 ? '' : 's'} (${fmt(g)} g)` : `${fmt(g)} g`;
  return {name: food.name, qty: label, kcal: Math.round(food.kcal * r), protein: num(food.protein * r), carbs: num(food.carbs * r), fat: num(food.fat * r), fiber: num(food.fiber * r)};
}
function waterMl(p) {
  if (p.unit === 'ml') return p.qty;
  if (p.unit === 'l') return p.qty * 1000;
  if (p.unit === 'bottle') return p.qty * 500;
  if (p.explicit && !p.unit && p.qty > 20) return p.qty;
  return p.qty * 250;
}
// "2 eggs, a banana and 150 g chicken breast" -> matched items (and water) ready to confirm.
function parseMeal(text) {
  const parts = String(text || '').split(/\s*(?:,|;|\n|\+|\band then\b|\band\b|\bwith\b|\bplus\b)\s*/i).map(x => x.trim()).filter(Boolean);
  const out = [];
  for (const part of parts) {
    const p = parseLine(part);
    if (!p.name) continue;
    if (/^(glass(es)? of |bottle(s)? of |cup(s)? of )?water$/.test(p.name) || p.name === 'water') { out.push({kind: 'water', raw: p.raw, ml: Math.round(waterMl(p))}); continue; }
    const weightUnit = ['g', 'kg', 'oz', 'lb', 'ml', 'l'].includes(p.unit);
    const hits = localSearch(p.name, 5).filter(f => !weightUnit || f.src === 'db');
    if (!hits.length) { out.push({kind: 'none', raw: p.raw, name: p.name, qty: p.qty, unit: p.unit}); continue; }
    const food = hits[0];
    out.push({kind: 'food', raw: p.raw, food, qty: p.qty, unit: p.unit, entry: portion(food, p.qty, p.unit)});
  }
  return out;
}

/* ---------- online search: Open Food Facts (packaged and branded foods) ---------- */
async function offSearch(q) {
  const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' + encodeURIComponent(q) + '&search_simple=1&action=process&json=1&page_size=24&fields=product_name,brands,nutriments,serving_quantity,serving_size';
  const r = await fetch(url);
  if (!r.ok) throw new Error('search failed');
  const j = await r.json();
  return (j.products || []).map(p => {
    const n = p.nutriments || {};
    let kcal = n['energy-kcal_100g'];
    if (kcal == null && n.energy_100g != null) kcal = n.energy_100g / 4.184;
    if (kcal == null || !p.product_name) return null;
    const brand = p.brands ? String(p.brands).split(',')[0].trim() : '';
    const sq = +p.serving_quantity;
    return {name: (p.product_name + (brand ? ' · ' + brand : '')).slice(0, 80), kcal: +kcal || 0, protein: +n.proteins_100g || 0, carbs: +n.carbohydrates_100g || 0, fat: +n.fat_100g || 0, fiber: +n.fiber_100g || 0,
      unit: 'serving', unitG: sq > 0 ? sq : 100, servingLabel: sq > 0 ? (p.serving_size || sq + ' g') : '', alias: [], src: 'off'};
  }).filter(Boolean);
}

function normFood(f) {
  return {name: String((f && f.name) || '').slice(0, 80), qty: String((f && f.qty) || '').slice(0, 40), kcal: Math.round(num(f && f.kcal)),
    protein: num(f && f.protein), carbs: num(f && f.carbs), fat: num(f && f.fat), fiber: num(f && f.fiber)};
}

/* ---------- voice: the browser's own speech recognition where it exists; the keyboard mic everywhere else ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
const speechOK = () => !!SR && !state.speechOff;
function toggleSpeech() {
  if (!speechOK()) return false;
  if (rec) { try { rec.stop(); } catch (e) {} return true; }
  let finalText = '';
  try { rec = new SR(); } catch (e) { state.speechOff = true; renderAll(); return false; }
  rec.lang = navigator.language || 'en-CA'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) finalText += r[0].transcript + ' '; else interim += r[0].transcript; }
    $('#c-partial').textContent = interim ? interim + '…' : '';
  };
  rec.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { state.speechOff = true; toast('Microphone isn’t allowed here. Use the mic key on your keyboard instead.'); } };
  rec.onend = () => {
    rec = null; state.listening = false; $('#c-partial').textContent = '';
    const t = finalText.trim();
    if (t) { const ta = $('#food-text'); ta.value = ta.value.trim() ? ta.value.trim() + ', ' + t : t; runQuickLog(); }
    renderAll();
  };
  try { rec.start(); state.listening = true; } catch (e) { rec = null; state.speechOff = true; }
  renderAll();
  return true;
}

/* ---------- backup ---------- */
function exportData() {
  const data = {app: 'slob-killer', version: 1, exported: new Date().toISOString(), items: {}};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(LSP)) data.items[k.slice(LSP.length)] = JSON.parse(localStorage.getItem(k)); } } catch (e) {}
  const name = `slob-killer-backup-${todayStr()}.json`;
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  try {
    const file = new File([blob], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { navigator.share({files: [file], title: 'Slob Killer backup'}).catch(() => {}); return; }
  } catch (e) {}
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.app !== 'slob-killer' || !d.items) throw new Error('not a backup');
      for (const k of Object.keys(localStorage)) if (k.startsWith(LSP)) localStorage.removeItem(k);
      for (const [k, v] of Object.entries(d.items)) localStorage.setItem(LSP + k, JSON.stringify(v));
      loadAll(); closeSheet(); toast('Backup restored.');
    } catch (e) { toast('That file isn’t a Slob Killer backup.'); }
  };
  r.readAsText(file);
}
function eraseAll() {
  try { for (const k of Object.keys(localStorage)) if (k.startsWith(LSP)) localStorage.removeItem(k); } catch (e) {}
  loadAll(); closeSheet(); toast('Everything was erased.');
}

const CATS = ['Meat', 'Dairy & eggs', 'Produce', 'Pantry', 'Snacks', 'Other'];
function mergeGroceries(list) {

function readout(d) {
  if (!d) return '';
  const lbl = esc(dLabel(d.date, {weekday: 'long', month: 'short', day: 'numeric'}));
  if (!d.logged && !d.exercise) return `<b>${lbl}</b> · nothing logged`;
  return `<b>${lbl}</b> · eaten ${fmt(d.eat.kcal)} · burned ${d.burned == null ? '—' : fmt(d.burned)}${d.logged && d.deficit != null ? ' · deficit ' + fmt(d.deficit) : ''}`;
}
function weekChart(days, sel) {
  const p = prof();
  const W = Math.max(300, Math.min(600, ($('#main').clientWidth || 360) - 34)), H = 200, L = 40, R = 6, T = 10, B = 24;
  const vals = days.flatMap(d => [d.logged ? d.eat.kcal : 0, d.burned || 0]);
  const maxV = Math.max(p.targetKcal || 0, 1000, ...vals);
  const step = maxV > 3200 ? 1000 : 500, top = Math.ceil(maxV / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const band = (W - L - R) / 7, bw = Math.min(16, (band - 12) / 2);
  const bar = (x, v, cls) => {
    if (!(v > 0)) return '';
    const y0 = y(0), yt = y(v), r = Math.min(4, (y0 - yt), bw / 2);
    return `<path class="${cls}" d="M${x},${y0} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${y0} Z"/>`;
  };
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="${v ? 'gl' : 'base'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`;
  let marks = '';
  days.forEach((d, i) => {
    const cx = L + band * (i + 0.5);
    if (i === sel) marks += `<rect class="selband" x="${L + band * i + 2}" y="${T}" width="${band - 4}" height="${H - T - B}" rx="6"/>`;
    marks += bar(cx - bw - 1, d.logged ? d.eat.kcal : 0, 'b1') + bar(cx + 1, d.burned || 0, 'b2');
    marks += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(dLabel(d.date, {weekday: 'narrow'}))}</text>`;
  });
  const tl = p.targetKcal ? `<line class="tg" x1="${L}" x2="${W - R}" y1="${y(p.targetKcal)}" y2="${y(p.targetKcal)}"/>` : '';
  let hits = '';
  days.forEach((d, i) => { hits += `<rect class="hit" data-act="chart-day" data-i="${i}" x="${L + band * i}" y="0" width="${band}" height="${H}"><title>${esc(readout(d).replace(/<[^>]+>/g, ''))}</title></rect>`; });
  const label = days.map(d => `${dLabel(d.date, {weekday: 'short'})}: eaten ${d.logged ? fmt(d.eat.kcal) : 'none'}, burned ${d.burned == null ? 'unknown' : fmt(d.burned)}`).join('; ');
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc('Calories eaten and burned per day. ' + label)}">${g}${marks}${tl}${hits}</svg>`;
}

    ${has ? '' : '<div class="hint">Everything you enter and log stays on this phone. Nothing is sent anywhere.</div><div class="small muted">Moving from another phone? <label class="linkbtn" for="imp-file" style="display:inline">Restore a backup</label><input type="file" id="imp-file" class="sr" accept="application/json,.json"></div>'}
    <div class="field"><label for="st-name">Your name (optional)</label><input id="st-name" value="${esc(p.name || '')}" autocomplete="given-name"></div>
    <div class="grid3">${nf('st-weight', 'Weight lb', has ? p.weightLb : '')}${nf('st-ft', 'Height ft', ft)}${nf('st-in', 'Height in', inch)}</div>
    <div class="grid3">${nf('st-age', 'Age', has ? p.age : '')}<div class="field"><label for="st-sex">Sex</label><select id="st-sex"><option value="male" ${p.sex === 'male' ? 'selected' : ''}>Male</option><option value="female" ${p.sex === 'female' ? 'selected' : ''}>Female</option></select></div>${nf('st-act', 'Base activity', p.activity, 'step="0.05"')}</div>
    <div class="grid2">${nf('st-goal', 'Goal weight lb', p.goalLb)}<div class="field"><label for="st-goaldate">Goal date</label><input id="st-goaldate" type="date" value="${esc(p.goalDate || '')}"></div></div>
    <div class="grid3">${nf('st-kcal', 'Eat target kcal', has ? p.targetKcal : '')}${nf('st-prot', 'Protein g', has ? p.proteinG : '')}${nf('st-water', 'Water goal ml', p.waterGoalMl)}</div>
    <button type="button" class="btn ghost" data-act="suggest">Suggest eat and protein targets for me</button>
    <div class="grid2">${nf('st-dmin', 'Deficit low', has ? p.deficitMin : 500)}${nf('st-dmax', 'Deficit cap', has ? p.deficitMax : 1000)}</div>
    <div class="small muted">Base burn uses the Mifflin-St Jeor formula × base activity (1.2 = desk job; workouts are added on top). Your latest morning weigh-in replaces the weight above.</div>
    <div class="lbl-s">Daily goals (0 = no goal)</div>
    <div class="grid3">${nf('st-run', 'Run km', st.runKm)}${nf('st-walk', 'Walk km', st.walkKm)}${nf('st-bike', 'Ride km', st.bikeKm)}</div>
    <div class="grid2">${nf('st-pu', 'Push-ups', st.pushups)}${nf('st-pl', 'Pull-ups', st.pullups)}</div>
    <button type="submit" class="btn">Save</button>
    ${has ? `<div class="lbl-s">My one-tap foods · ${mine.length}</div>
    <div class="list">${mine.length ? mine.map((f, i) => `<div class="row" style="cursor:default"><span class="t num">${fmt(f.kcal)}</span><span><span class="n">${esc(f.name)}</span><br><span class="s">${esc(f.qty || '')} · P ${fmt1(f.protein)}</span></span><button type="button" class="xbtn" data-act="myfood-del" data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('') : '<div class="empty">Tick “Save to my one-tap foods” when adding a food.</div>'}</div>
    <div class="lbl-s">Backup</div>
    <div class="small muted">Your log lives only on this phone. Save a backup now and then, or before moving to a new phone.</div>
    <div class="btns"><button type="button" class="btn ghost grow" data-act="export">Save a backup</button><label class="btn ghost grow" for="imp-file">Restore a backup</label><input type="file" id="imp-file" class="sr" accept="application/json,.json"></div>
    <button type="button" class="btn ghost danger" data-act="erase">Erase all my data</button>` : ''}
  </form>`);
}

/* ---------- actions ---------- */
function setDate(d) { state.date = d; state.weekSel = null; ensureDay(d); renderAll(); window.scrollTo(0, 0); }
function findFood(date, id) { return ((state.days[date] || {}).foods || []).find(f => f.id === id); }
function findWo(date, id) { return ((state.days[date] || {}).workouts || []).find(w => w.id === id); }
function addFoods(date, items, src) {
  const doc = dayDoc(date), time = date === todayStr() ? nowHM() : '12:00';
  for (const it of items) doc.foods.push(Object.assign(normFood(it), {id: uid(), time, src}));
  putDay(date, doc);
}
const ACT = {
  'date-prev': t => setDate(addDays(state.date, t.dataset.unit === 'week' ? -7 : -1)),
  'date-next': t => setDate(addDays(state.date, t.dataset.unit === 'week' ? 7 : 1)),
  'date-today': () => setDate(todayStr()),
  settings: () => settingsSheet(),
  'sheet-close': () => closeSheet(),
  'run-cmd': () => runQuickLog(),
  search: () => searchSheet($('#food-text').value.trim(), {ctx: 'add'}),
  mic: () => toggleSpeech(),
  speak: () => {
    if (state.view !== 'today') { state.view = 'today'; for (const v of VIEWS) $('#view-' + v).hidden = v !== 'today'; try { location.hash = 'today'; } catch (e) {} renderAll(); }
    if (speechOK() && toggleSpeech()) return;
    const ta = $('#food-text'); ta.focus(); ta.scrollIntoView({block: 'center'});
  },
  'q-add': () => addQuick(),
  'q-clear': () => { state.quick = null; renderAll(); },
  'q-del': t => { state.quick.items.splice(+t.dataset.i, 1); if (!state.quick.items.length) state.quick = null; renderAll(); },
  'q-edit': t => { const it = state.quick && state.quick.items[+t.dataset.i]; if (it && it.food) amountSheet(it.food, it.qty, it.unit || 'unit', {ctx: 'quick', i: +t.dataset.i}); },
  'q-search': t => { const it = state.quick && state.quick.items[+t.dataset.i]; if (it) searchSheet(it.name || it.raw, {ctx: 'quick', i: +t.dataset.i}); },
  'srch-online': () => searchOnline(),
  'srch-pick': t => {
    const k = t.dataset.k, sr = state.srch; if (!sr) return;
    const f = k[0] === 'o' ? (sr.online || [])[+k.slice(1)] : sr.local[+k.slice(1)];
    if (f) amountSheet(f, f.src === 'off' && !f.servingLabel ? 100 : 1, f.src === 'off' && !f.servingLabel ? 'g' : 'unit', sr.ctx);
  },
  'tip-home': () => { LS.set('tipHome', true); renderAll(); },
  'export': () => exportData(),
  'erase': t => { if (!state.eraseArmed) { state.eraseArmed = true; t.textContent = 'Tap again to erase everything'; setTimeout(() => { state.eraseArmed = false; if (t.isConnected) t.textContent = 'Erase all my data'; }, 4000); return; } state.eraseArmed = false; eraseAll(); },
  suggest: () => {
    const v = id => num($('#' + id).value), sex = $('#st-sex').value, lb = v('st-weight'), inch = v('st-ft') * 12 + v('st-in'), age = v('st-age');
    if (!lb || !inch || !age) { toast('Fill in weight, height and age first.'); return; }
    const kg = lb * 0.45359237, cm = inch * 2.54, base = (10 * kg + 6.25 * cm - 5 * age + (sex === 'female' ? -161 : 5)) * (v('st-act') || 1.2);
    $('#st-kcal').value = Math.round((base - 500) / 10) * 10;
    $('#st-prot').value = Math.round((v('st-goal') || lb) * 0.8 / 5) * 5;
    if (!v('st-dmin')) $('#st-dmin').value = 500; if (!v('st-dmax')) $('#st-dmax').value = 1000;
    toast('Targets filled in. Adjust them if you like, then Save.');
  },
  'ex-add': t => {
    const w = readWo(true), ex = (w.exercises || []).filter(e => e.name || e.reps !== '');
    const nm = t.dataset.name || '', prev = ex.length ? +ex[ex.length - 1].lb || '' : '';
    ex.push({name: nm, reps: '', lb: isPush(nm) || isPull(nm) ? '' : (prev || lastLoad())});
    w.exercises = ex; $('#wo-fields').innerHTML = woFields(w);
    const rows = document.querySelectorAll('#wo-form .exrow'), last = rows[rows.length - 1];
    if (last) (nm ? last.querySelector('.ex-reps') : last.querySelector('.ex-name')).focus();
    updateWoEst();
  },
  'ex-del': t => { const w = readWo(true); w.exercises.splice(+t.dataset.i, 1); $('#wo-fields').innerHTML = woFields(w); updateWoEst(); },
  'water-add': t => { const ml = +t.dataset.ml, doc = dayDoc(state.date); doc.waterMl = Math.max(0, (+doc.waterMl || 0) + ml); putDay(state.date, doc); },
  'manual-food': () => foodSheet(state.date, {name: ($('#srch-q') ? $('#srch-q').value : $('#food-text').value).trim()}),
  quick: t => { const f = state.quickList[+t.dataset.i]; if (!f) return; addFoods(state.date, [f], 'quick'); toast(`Logged ${f.name} · ${fmt(f.kcal)} kcal`); },
  'food-edit': t => { const f = findFood(state.date, t.dataset.id); if (f) foodSheet(state.date, f); },
  'food-del': () => { const f = $('#food-form'); const doc = dayDoc(f.dataset.date); doc.foods = doc.foods.filter(x => x.id !== f.dataset.id); putDay(f.dataset.date, doc); closeSheet(); toast('Deleted.'); },
  'wo-new': () => woSheet(state.date, {type: 'run', km: '', minutes: ''}),
  'wo-tmpl': t => woSheet(state.date, clone(templates()[+t.dataset.i].w)),
  'wo-edit': t => { const date = t.dataset.date || state.date; const w = findWo(date, t.dataset.id); if (w) woSheet(date, clone(w)); },
  'wo-del': () => { const f = $('#wo-form'); const doc = dayDoc(f.dataset.date); doc.workouts = doc.workouts.filter(x => x.id !== f.dataset.id); putDay(f.dataset.date, doc); closeSheet(); toast('Deleted.'); },
  'bed-now': () => { const n = new Date(), wake = n.getHours() >= 12 ? addDays(todayStr(), 1) : todayStr(); const doc = dayDoc(wake); doc.sleep.bed = nowHM(); delete doc.sleep.wake; putDay(wake, doc); toast(`Bedtime ${t12(nowHM())} saved. Good night.`); },
  'up-now': () => { const doc = dayDoc(todayStr()); doc.sleep.wake = nowHM(); putDay(todayStr(), doc); toast(`Wake-up ${t12(nowHM())} saved.`); },
  'chart-day': t => { state.weekSel = +t.dataset.i; const days = weekData(); $('#w-chart').innerHTML = weekChart(days, state.weekSel); $('#w-readout').innerHTML = readout(days[state.weekSel]); },
  'shop-got': t => editItem(t.dataset.id, i => { i.got = !i.got; }),
  'shop-unneed': t => editItem(t.dataset.id, i => { i.need = false; i.got = false; }),
  'shop-need': t => editItem(t.dataset.id, i => { i.need = !i.need; i.got = false; }),
  'shop-del': t => { const items = (clone(state.staples).items || []).filter(i => i.id !== t.dataset.id); putConfig('staples', {items}); },
  'shop-restock': () => { const items = clone(state.staples).items || []; let n = 0; for (const i of items) if (i.staple && !i.need) { i.need = true; i.got = false; n++; } putConfig('staples', {items}); toast(n ? `Added ${n} regulars to the list.` : 'All your regulars are already on the list.'); },
  'shop-clear': () => { const items = (clone(state.staples).items || []).filter(i => !(i.got && !i.staple)); for (const i of items) if (i.got) { i.got = false; i.need = false; } putConfig('staples', {items}); },
  'shop-copy': async () => { const txt = shopText(); try { await navigator.clipboard.writeText(txt); toast('List copied. Paste it into Notes or a message.'); } catch (e) { openSheet('Your list', `<textarea readonly rows="14" aria-label="Shopping list text">${esc(txt)}</textarea><div class="small muted">Press and hold to select all, then copy.</div>`); } },
  'myfood-del': t => { const items = clone(state.myfoods).items || []; items.splice(+t.dataset.i, 1); putConfig('myfoods', {items}); settingsSheet(); }
};
function editItem(id, fn) { const items = clone(state.staples).items || []; const i = items.find(x => x.id === id); if (i) { fn(i); putConfig('staples', {items}); } }

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-act="chart-day"]'); if (t && +t.dataset.i !== state.weekSel) ACT['chart-day'](t); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'imp-file') { const f = e.target.files && e.target.files[0]; if (f) importData(f); e.target.value = ''; return; }
  if (id === 'am-unit') { updateAmount(); return; }
  if (id === 'sleep-bed' || id === 'sleep-wake') {
    const doc = dayDoc(state.date); doc.sleep[id === 'sleep-bed' ? 'bed' : 'wake'] = e.target.value; putDay(state.date, doc);
  } else if (id === 'weight-in') {
    const doc = dayDoc(state.date), v = num(e.target.value);
    if (v > 0) doc.weightLb = v; else delete doc.weightLb;
    putDay(state.date, doc);
  } else if (id === 'wo-type') {
    const w = readWo(); w.met = 0; if (w.type === 'soccer' && !w.minutes) w.minutes = 60; $('#wo-fields').innerHTML = woFields(w); updateWoEst();
  }
});
document.addEventListener('keydown', e => {
  if (e.isComposing) return;
  if (e.target.id === 'food-text' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runQuickLog(); }
  if (e.target.id === 'srch-q' && e.key === 'Enter') { e.preventDefault(); searchOnline(); }
});
document.addEventListener('input', e => {
  if (e.target.closest('#wo-form')) updateWoEst();
  if (e.target.id === 'srch-q') { if (state.srch) { state.srch.online = null; state.srch.onlineState = ''; } renderSearch(); }
  if (e.target.id === 'am-qty') updateAmount();
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, v = id => { const el = $('#' + id); return el ? el.value : ''; };
  if (f.id === 'food-form') {
    const date = f.dataset.date, doc = dayDoc(date);
    const item = Object.assign(normFood({name: v('ff-name').trim(), qty: v('ff-qty').trim(), kcal: v('ff-kcal'), protein: v('ff-protein'), carbs: v('ff-carbs'), fat: v('ff-fat'), fiber: v('ff-fiber')}), {time: v('ff-time') || '12:00'});
    if (!item.name) return;
    const ex = doc.foods.find(x => x.id === f.dataset.id);
    if (ex) Object.assign(ex, item); else doc.foods.push(Object.assign(item, {id: uid(), src: 'manual'}));
    putDay(date, doc);
    if ($('#ff-fav').checked) {
      const items = (clone(state.myfoods).items || []).filter(x => x.name.trim().toLowerCase() !== item.name.toLowerCase());
      const {time, ...fav} = item; items.push(fav); putConfig('myfoods', {items});
    }
    if (!f.dataset.id) { $('#food-text').value = ''; }
    closeSheet(); toast('Saved.');
  } else if (f.id === 'wo-form') {
    const date = f.dataset.date, doc = dayDoc(date), w = readWo();
    const ex = doc.workouts.find(x => x.id === f.dataset.id);
    if (ex) { for (const k of Object.keys(ex)) if (k !== 'id') delete ex[k]; Object.assign(ex, w); } else doc.workouts.push(Object.assign(w, {id: uid()}));
    putDay(date, doc); closeSheet(); toast(`Saved · ${fmt(workoutKcal(w, date))} kcal`);
  } else if (f.id === 'amount-form') {
    submitAmount();
  } else if (f.id === 'settings-form') {
    const p = Object.assign({}, clone(state.profile), {
      name: v('st-name').trim().slice(0, 40), weightLb: num(v('st-weight')), heightIn: num(v('st-ft')) * 12 + num(v('st-in')), age: Math.round(num(v('st-age'))), sex: v('st-sex'),
      goalLb: num(v('st-goal')), goalDate: v('st-goaldate'), targetKcal: Math.round(num(v('st-kcal'))) || DEFAULTS.targetKcal,
      proteinG: Math.round(num(v('st-prot'))) || DEFAULTS.proteinG, activity: num(v('st-act')) || 1.2,
      deficitMin: Math.round(num(v('st-dmin'))), deficitMax: Math.round(num(v('st-dmax'))) || DEFAULTS.deficitMax, waterGoalMl: Math.round(num(v('st-water'))) || DEFAULTS.waterGoalMl,
      standard: {runKm: num(v('st-run')), walkKm: num(v('st-walk')), bikeKm: num(v('st-bike')), pushups: Math.round(num(v('st-pu'))), pullups: Math.round(num(v('st-pl')))}
    });
    if (!p.weightLb || !p.heightIn || !p.age) { toast('Weight, height and age are needed to work out what you burn.'); return; }
    putConfig('profile', p); closeSheet(); toast('Saved.');
  } else if (f.id === 'shop-form') {
    const name = v('shop-name').trim(); if (!name) return;
    mergeGroceries([{name, staple: $('#shop-staple').checked, cat: guessCat(name)}]);
    $('#shop-name').value = '';
  }
});
function guessCat(n) {
  n = n.toLowerCase();
  if (/beef|steak|chicken|turkey|bison|venison|meat|liver|ground|brisket|ribeye|sirloin/.test(n) && !/jerky|stick/.test(n)) return 'Meat';
  if (/egg|cheese|mozz|grana|parm|yogurt|yoghurt|milk|butter|cream|kefir/.test(n)) return 'Dairy & eggs';
  if (/apple|banana|berr|spinach|kale|broccoli|pepper|onion|garlic|lettuce|zucchini|asparagus|avocado|tomato|carrot|cucumber|lemon|veg|fruit|potato|mushroom/.test(n)) return 'Produce';
  if (/jerky|stick|bar|chips/.test(n)) return 'Snacks';
  if (/butter|oil|salt|pepper|spice|honey|rice|oats|sauce|vinegar|flour|tallow|ghee/.test(n)) return 'Pantry';
  return 'Other';
}

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }

/* ---------- routing + start ---------- */
function route() {
  const h = location.hash.slice(1);
  if (/^log-/i.test(h)) { queueSiri(h.slice(4)); state.view = 'today'; try { location.hash = 'today'; } catch (e) {} renderAll(); return; }
  state.view = VIEWS.includes(h) ? h : 'today'; state.weekSel = null; renderAll();
}
// A Siri Shortcut opens the app with #log-what-you-said; the app logs it once, then clears the hash.
function queueSiri(raw) {
  let text = raw; try { text = decodeURIComponent(raw); } catch (e) {}
  text = text.replace(/[-_+]+/g, ' ').replace(/(\d)\s*point\s*(\d)/gi, '$1.$2').replace(/([a-z])Point(?=\s|$)/g, '$1').replace(/\s+point(?=\s|$)/gi, '').replace(/\s+/g, ' ').trim();
  if (!text) return;
  let last = null; try { last = JSON.parse(localStorage.getItem(LSP + 'lastSiri')); } catch (e) {}
  if (last && last.raw === raw && Date.now() - last.t < 10 * 60 * 1000) { toast('Already logged that one.'); return; }
  try { localStorage.setItem(LSP + 'lastSiri', JSON.stringify({raw, t: Date.now()})); } catch (e) {}
  state.pendingSiri = text;
}
function runPendingSiri() {
  if (!state.pendingSiri || state.mode === 'loading' || !allLoaded()) return;
  const text = state.pendingSiri; state.pendingSiri = null;
  $('#food-text').value = text;
  runQuickLog();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
window.addEventListener('resize', () => { if (state.view === 'week') { $('#w-all')._h = ''; renderAll(); } });
// Roll over to the new day if the app stays open past midnight.
let lastToday = todayStr();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayStr() !== lastToday) { if (state.date === lastToday) state.date = todayStr(); lastToday = todayStr(); renderAll(); } });

function init() {
  route();
  loadAll();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!state.profile) setTimeout(settingsSheet, 300);
}
init();
})();
</script>
</body>
